<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CL4P-TP Status</title>
    <link rel="stylesheet" href="/shared/theme.css" />
    <link rel="stylesheet" href="/status-page/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <a class="brand" href="/">
          <span class="brand-mark">⌁</span>
          <span>CL4P-TP</span>
        </a>
        <h1>Status</h1>
        <p class="sub" id="summary">conectando...</p>
      </header>

      <section class="bento">
        <article class="panel system">
          <h2>Sistema</h2>
          <div id="system-metrics" class="stat-grid"></div>
        </article>

        <article class="panel storage">
          <h2>Armazenamento</h2>
          <div id="storage"></div>
        </article>

        <article class="panel services">
          <h2>Serviços</h2>
          <div id="services"></div>
        </article>
      </section>

      <footer class="footer">
        <span id="last-updated"></span>
      </footer>
    </main>

    <script src="/status-page/app.js"></script>
  </body>
</html>
