<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CL4P-TP Notas</title>
    <link rel="stylesheet" href="/notes/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow"><a href="/">CL4P-TP</a></p>
        <h1>Notas</h1>
        <p class="sub">Texto e imagens impressos direto na SUNMI.</p>
      </header>

      <section class="card">
        <form id="noteForm">
          <textarea id="noteText" placeholder="Escreva sua nota ou legenda..." rows="3"></textarea>

          <div class="image-row">
            <label class="file-button">
              Anexar imagem
              <input type="file" id="imageInput" accept="image/*" hidden />
            </label>
            <button type="button" id="cameraButton" class="file-button" hidden>Tirar foto</button>
          </div>

          <video id="cameraPreview" autoplay playsinline hidden></video>
          <div id="cameraControls" class="image-row" hidden>
            <button type="button" id="captureButton">Capturar</button>
            <button type="button" id="cancelCameraButton">Cancelar</button>
          </div>

          <div id="imagePreviewWrap" class="image-preview-wrap" hidden>
            <canvas id="imageCanvas"></canvas>
            <div class="image-row">
              <button type="button" id="rotateButton">Rotacionar</button>
              <button type="button" id="removeImageButton">Remover imagem</button>
            </div>
          </div>

          <button id="submitButton" type="submit">Imprimir na SUNMI</button>
          <p id="formStatus" class="hint"></p>
        </form>
      </section>

      <section class="card">
        <h2>Histórico</h2>
        <div id="notesList" class="notes-list"></div>
      </section>
    </main>

    <script src="/notes/app.js"></script>
  </body>
</html>
